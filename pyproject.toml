[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "samrust"
version = "0.1.0"
description = "Rust-native, multi-threaded, pysam-compatible HTS processing for Linux/HPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SAMRust contributors" }]
keywords = ["bioinformatics", "bam", "sam", "hts", "pysam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pysam>=0.22", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/Caizhaohui/SAMRust"
Documentation = "https://github.com/Caizhaohui/SAMRust#readme"

[tool.maturin]
manifest-path = "crates/samrust-python/Cargo.toml"
module-name = "samrust._samrust"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
